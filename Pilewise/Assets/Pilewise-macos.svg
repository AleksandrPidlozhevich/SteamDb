<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Pilewise</title>
  <!-- macOS icon: the mark on a tile on Apple's grid (824px tile centred in 1024) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#14213D"/>
  <g transform="translate(130 157) scale(1.42)">
  <!-- The checklist: a gold card, two games done, one to go -->
  <rect x="40" y="24" width="312" height="336" rx="44" fill="#F4B740"/>
  <g fill="#14213D">
    <rect x="80" y="76" width="64" height="64" rx="16"/>
    <rect x="80" y="164" width="64" height="64" rx="16"/>
    <rect x="166" y="94" width="146" height="28" rx="14"/>
    <rect x="166" y="182" width="146" height="28" rx="14"/>
  </g>
  <path d="M96 108 L109 121 L130 94 M96 196 L109 209 L130 182" fill="none" stroke="#F4B740" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- The controller: navy with white controls, a white rim so it holds on dark grounds -->
  <defs><g id="pad">
    <rect x="168" y="268" width="320" height="148" rx="74"/>
    <rect x="174" y="312" width="116" height="150" rx="58" transform="rotate(16 232 387)"/>
    <rect x="366" y="312" width="116" height="150" rx="58" transform="rotate(-16 424 387)"/>
  </g></defs>
  <use href="#pad" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="24" stroke-linejoin="round"/>
  <use href="#pad" fill="#14213D"/>
  <g fill="#FFFFFF">
    <rect x="200" y="329" width="80" height="26" rx="7"/>
    <rect x="227" y="302" width="26" height="80" rx="7"/>
    <circle cx="416" cy="314" r="14"/>
    <circle cx="416" cy="370" r="14"/>
    <circle cx="388" cy="342" r="14"/>
    <circle cx="444" cy="342" r="14"/>
  </g>
  </g>
</svg>
