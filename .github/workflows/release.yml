# Builds SteamDb for Windows, macOS and Linux and publishes a GitHub Release.
#
# Release:  git tag v1.2.0 && git push origin v1.2.0
# Dry run:  Actions → Release → Run workflow (builds the packages as workflow artifacts, no release)

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '9.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet test SteamDb.Tests/SteamDb.Tests.csproj -c Release

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: osx-arm64
            os: macos-latest
          - rid: osx-x64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Determine version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Publish
        run: >
          dotnet publish SteamDb/SteamDb.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:Version=${VERSION}
          -o publish

      - name: Package (Windows)
        if: startsWith(matrix.rid, 'win')
        shell: pwsh
        run: |
          # SkiaSharp/HarfBuzz ship native .pdb files that DebugType=none doesn't cover.
          Remove-Item publish/*.pdb -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path publish/* -DestinationPath dist/SteamDb-${{ matrix.rid }}.zip

      - name: Package (Linux)
        if: startsWith(matrix.rid, 'linux')
        run: |
          mkdir -p dist
          chmod +x publish/SteamDb
          tar -czf dist/SteamDb-${{ matrix.rid }}.tar.gz -C publish .

      - name: Package (macOS .app)
        if: startsWith(matrix.rid, 'osx')
        run: |
          app=SteamDb.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" dist
          cp -R publish/. "$app/Contents/MacOS/"
          chmod +x "$app/Contents/MacOS/SteamDb"
          cp SteamDb/Assets/gamedate.icns "$app/Contents/Resources/"
          sed "s/__VERSION__/${VERSION}/g" build/macos/Info.plist > "$app/Contents/Info.plist"
          # Ad-hoc signature: required for Apple Silicon to launch the binary at all.
          codesign --force --deep --sign - "$app"
          ditto -c -k --keepParent "$app" dist/SteamDb-${{ matrix.rid }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SteamDb-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
